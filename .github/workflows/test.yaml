name: Run Tests
on:
  workflow_dispatch: {}
  pull_request: {}
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    name: "Test library"
    runs-on: ubuntu-26.04

    steps:
      - name: "Check out code"
        uses: actions/checkout@v4

      - name: "Set up JDK 25"
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: "Run tests"
        run: ./kotlin test
