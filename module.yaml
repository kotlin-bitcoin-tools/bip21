product: jvm/lib
description: A Kotlin library to parse and generate BIP-21 bitcoin payment URIs.

repositories:
  - url: mavenLocal
    publish: true

settings:
  kotlin:
    version: 2.4.20
    languageVersion: 2.2
    apiVersion: 2.2
    explicitApi: strict

  jvm:
    jdk:
      version: 25
      distributions: [temurin]
      selectionMode: auto
    release: 17

  publishing:
    enabled: true
    group: org.kotlinbitcointools
    version: 0.2.0-SNAPSHOT
    artifactId: bip21
    # Publishing to Maven Central and signing are disabled by default so that anyone can publish the library to their
    # local Maven repository with `just publish-local`, without a signing key.
    mavenCentral:
      publishingMode: manual
      enabled: false         # Set to true to release on Maven Central
    signArtifacts: false     # Set to true to release on Maven Central
    publishSources: true
    pom:
      name: bip21
      url: https://github.com/kotlin-bitcoin-tools/bip21
      scm: https://github.com/kotlin-bitcoin-tools/bip21
      developers:
        - name: thunderbiscuit
      licenses:
        - name: Apache-2.0
          url: https://www.apache.org/licenses/LICENSE-2.0.txt
